# Local stack. The API talks to Ollama on the host; change Store__Provider to switch engines.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      Store__Provider: qdrant
      Store__Url: http://qdrant:6333
      Ollama__Endpoint: http://host.docker.internal:11434
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [qdrant]
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports: ["6333:6333"]
  weaviate:
    image: semitechnologies/weaviate:1.30.3
    profiles: [weaviate]
    ports: ["8080:8080"]
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    profiles: [elasticsearch]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
