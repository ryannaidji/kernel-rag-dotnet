name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["evals/results/**", "docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build KernelRag.sln -c Release
      - run: dotnet test KernelRag.sln -c Release --no-build --logger "console;verbosity=normal"

  store-integration:
    # Contract tests of each store implementation against the real engine. Fake embeddings, no LLM.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.13.6
        ports: ["6333:6333"]
      weaviate:
        image: semitechnologies/weaviate:1.30.3
        ports: ["8080:8080"]
        env:
          AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
          PERSISTENCE_DATA_PATH: /var/lib/weaviate
          DEFAULT_VECTORIZER_MODULE: none
          CLUSTER_HOSTNAME: node1
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        ports: ["9200:9200"]
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: bash scripts/wait_for_stores.sh
      - run: dotnet test KernelRag.sln -c Release --filter "FullyQualifiedName~StoreIntegrationTests" --logger "console;verbosity=normal"
        env:
          RUN_STORE_INTEGRATION: "1"

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kernel-rag-dotnet .
